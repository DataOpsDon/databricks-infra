name: 1.0$(Rev:.r)--$(Date:yy.MM.dd)

trigger:
  branches:
    include:
    - none
  paths:
    include: 
    - data-landing-zone/unity-catalog/terraform

stages: 
  - template: ../../templates/yaml/pr-validation.yml
    parameters:
        buildTemplatePath: ../../data-landing-zone/unity-catalog/yaml/build.yml
        landingZone: data-landing-zone/unity-catalog
        serviceConnection: sc-ado-fwk-npd
        environment: #TODO: Add environment name here
        terraform_version: 1.15.9