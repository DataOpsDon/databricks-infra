parameters:
  - name: serviceConnection
    default: ""
  - name: stateServiceConnection
    default: ""
  - name: environmentVariableGroup
    default: ""
  - name: environment
    default: ""
  - name: landingZone
    default: ""
  - name: location
    default: ""
  - name: agentPool
    default: ""
  - name: agentImage
    default: ""
  - name: frameworkType
    default: ""
  - name: terraform_version
    default: ""

jobs:
  - template: "../../../templates/yaml/deploy-terraform.yml"
    parameters:
      environment: ${{ parameters.environment }}
      environmentVariableGroup: ${{parameters.environmentVariableGroup}}
      landingZone: ${{ parameters.landingZone }}
      serviceConnection: "${{ parameters.serviceConnection}}"
      stateServiceConnection: "${{ parameters.stateServiceConnection}}"
      agentPool: ${{ parameters.agentPool }}
      agentImage: ${{ parameters.agentImage }}
      terraform_version: ${{ parameters.terraform_version }}
      terraformVars: "../terraform/tfvars/${{ parameters.environment }}.tfvars"