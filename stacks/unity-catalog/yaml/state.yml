# File: variables/build.yml
parameters:

- name: environment
  default: ""

- name: landingZone
  default: ""

variables:

- name: stateSubscriptionId
  value: 'd5797584-a55d-49db-99fb-43e80779a615'

- name: stateResourceGroupName
  value: 'rg-fwk-tf-${{ parameters.environment }}-uks'

- name: stateStorageAccountName
  value: 'stfwktf${{ parameters.environment }}uks01'

- name: stateStorageAccountContainerName
  value: 'dataplatform-tfstate'

- name: key 
  value: 'stateunitycatalog'

- ${{ if eq(parameters.environment, 'dev') }}:
  - name: adminGroupName
    value: 'AAD-RBAC-SUB-Applications-Framework-DEV-dataadmins'
  - name: buildAgentName
    value: 'mi-npd-ado-fwk-identity-uks-001'
  - name: key 
    value: 'stateunitycatalog-dev'
- ${{ if eq(parameters.environment, 'test') }}:
  - name: adminGroupName
    value: 'AAD-RBAC-SUB-Applications-Framework-TEST-dataadmins'
  - name: buildAgentName
    value: 'mi-npd-ado-fwk-identity-uks-001'
  - name: key 
    value: 'stateunitycatalog-test'
- ${{ if eq(parameters.environment, 'preprod') }}:
  - name: adminGroupName
    value: ''
  - name: buildAgentName
    value: ''
  - name: key 
    value: 'stateunitycatalog-preprod'
- ${{ if eq(parameters.environment, 'prod') }}:
  - name: adminGroupName
    value: ''
  - name: buildAgentName
    value: ''
  - name: key 
    value: 'stateunitycatalog-prod'